name: my_first_flutter_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/logos/game_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#091210"
  adaptive_icon_foreground: "lib/assets/images/logos/game_logo.png"

flutter:
  uses-material-design: true

  # ===========================================================================
  # ASSET PIPELINE
  # ===========================================================================
  assets:
    - lib/assets/images/logos/
    - lib/assets/images/backgrounds/
    - lib/assets/images/paddles/
    - lib/assets/images/characters/
    - lib/assets/sounds/sfx/
    - lib/assets/sounds/music/